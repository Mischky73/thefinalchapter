<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3a0000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#1a0000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base black -->
  <rect width="1920" height="1080" fill="#080808"/>

  <!-- Subtle noise texture -->
  <rect width="1920" height="1080" filter="url(#noise)" opacity="0.08" fill="#333"/>

  <!-- Red glow left -->
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <!-- Red glow right -->
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- Diagonal crack lines - decorative -->
  <g stroke="#1e0000" stroke-width="1" opacity="0.4" filter="url(#blur1)">
    <line x1="200" y1="0" x2="0" y2="400"/>
    <line x1="500" y1="0" x2="200" y2="600"/>
    <line x1="900" y1="0" x2="600" y2="800"/>
    <line x1="1300" y1="0" x2="1000" y2="1080"/>
    <line x1="1700" y1="0" x2="1400" y2="900"/>
    <line x1="1920" y1="200" x2="1600" y2="1080"/>
  </g>

  <!-- Very subtle grid -->
  <g stroke="#111" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Top vignette -->
  <rect width="1920" height="200" fill="url(#vt)"/>
  <defs>
    <linearGradient id="vt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Bottom vignette -->
  <rect y="880" width="1920" height="200" fill="url(#vb)"/>
</svg>
